<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile | ShareMats</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body th:attr="data-signed-in=${currentUser != null}"><header th:replace="~{fragments/layout :: siteHeader}"></header><main class="auth-page"><p class="eyebrow">YOUR BROWSING PREFERENCE</p><h1 class="page-title">My profile<span>.</span></h1><p class="page-intro">Your course preference helps us start your browsing in the right place. It does not limit which approved resources you can open.</p>
    <div class="notice notice-success" th:if="${saved}">Your preferences have been saved.</div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
    <form class="form-card" th:action="@{/profile}" method="post">
        <label>Preferred programme<select name="programmeId" id="profile-programme" data-selected="" data-semester-target="profile-semester"><option value="">All courses</option><option th:each="option : ${programmes}" th:value="${option.id}" th:text="${option.name}" th:selected="${option.id == preferredProgrammeId}"></option></select></label>
        <label>Current semester<select name="semesterId" id="profile-semester" data-selected="" data-semesters="true"><option value="">All semesters</option><option th:each="option : ${semesters}" th:value="${option.id}" th:text="${option.label}" th:selected="${option.id == preferredSemesterId}"></option></select></label>
        <button class="button" type="submit">Save preference</button>
        <a class="text-link" th:href="@{/resources(allCourses=true)}">Browse all courses →</a>
    </form>
</main><footer th:replace="~{fragments/layout :: siteFooter}"></footer></body>
</html>
