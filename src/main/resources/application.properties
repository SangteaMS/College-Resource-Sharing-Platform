spring.application.name=college-resource-sharing
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/collegehub?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
collegehub.storage.location=${COLLEGEHUB_STORAGE_LOCATION:./uploads}
collegehub.upload.max-size-bytes=${COLLEGEHUB_MAX_UPLOAD_BYTES:20971520}
collegehub.seed.admin-email=${COLLEGEHUB_ADMIN_EMAIL:}
collegehub.seed.admin-password=${COLLEGEHUB_ADMIN_PASSWORD:}
collegehub.seed.admin-name=${COLLEGEHUB_ADMIN_NAME:Demo Administrator}
