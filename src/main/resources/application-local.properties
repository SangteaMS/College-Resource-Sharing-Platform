# Local development database. H2 stores this database under ./data and keeps it after restart.
spring.datasource.url=jdbc:h2:file:./data/collegehub-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.flyway.enabled=true
